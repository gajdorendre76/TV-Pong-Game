<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#000000"><title>TV Pong Controller</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}main{height:100dvh;display:flex;flex-direction:column;text-align:center;align-items:center;justify-content:space-between;padding:22px}h1{font-size:24px;letter-spacing:3px;margin:0}input{background:#171717;color:#fff;border:2px solid #777;border-radius:8px;font-size:20px;padding:10px;width:min(78vw,320px);text-align:center}button{background:#ff7417;color:#000;border:0;border-radius:8px;padding:11px 18px;font-weight:bold;font-size:17px}#identity{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}select{background:#222;color:white;border:2px solid white;border-radius:8px;font-size:20px;padding:12px}#pad{width:100%;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none;user-select:none;font-size:28px;gap:20px}#arrows{font-size:80px;line-height:1.3;color:#eee}small{color:#aaa}#status{font-size:14px;color:#8f8}#sensitivity-box{width:100%;max-width:440px;padding:10px 12px 4px;background:#121212;border:1px solid #444;border-radius:12px}#sensitivity-box label{display:flex;justify-content:space-between;gap:8px;font-size:15px;margin-bottom:8px}#sensitivity{width:100%;height:30px;accent-color:#ff7417;touch-action:auto}#sensitivity-box small{display:block;margin:3px 0 0;font-size:12px}#connection-panel{font-size:14px;color:#ddd;width:100%;max-width:440px;padding:7px 10px;border-top:1px solid #333}#dot{color:#f66}#roster,#game-state{font-size:12px;color:#bbb;margin-top:4px}#reconnect{font-size:12px;margin-top:6px;padding:7px 12px;background:#303d52;color:#fff}#status{color:inherit}</style></head><body><main><h1>TV PONG</h1><label>Player: <select id="player"><option value="1">1 - LEFT</option><option value="2">2 - RIGHT</option><option value="3">3 - LEFT TEAM</option><option value="4">4 - RIGHT TEAM</option></select></label><div id="identity"><input id="name" maxlength="22" placeholder="Enter your name" autocomplete="nickname"><button id="save" type="button">SAVE NAME</button></div><div id="pad"><div id="arrows">↑<br>↕<br>↓</div><strong>SWIPE UP / DOWN</strong><small>Swipe up or down to move your paddle.</small></div><section id="sensitivity-box"><label for="sensitivity"><span>Paddle sensitivity</span><strong id="sensitivity-value">100%</strong></label><input type="range" id="sensitivity" min="25" max="250" step="5" value="100" aria-label="Paddle movement sensitivity"><small>Left: slower • Right: faster</small></section><div id="connection-panel"><span id="dot">●</span> <span id="status">Connecting...</span><div id="roster">Players: –</div><div id="game-state">Waiting for game</div><button id="reconnect" type="button">RECONNECT</button></div></main><script>const pad=document.getElementById('pad'),status=document.getElementById('status'),player=document.getElementById('player');const nameInput=document.getElementById('name'),saveBtn=document.getElementById('save'),dot=document.getElementById('dot'),roster=document.getElementById('roster'),gameState=document.getElementById('game-state');const params=new URLSearchParams(location.search);if(['1','2','3','4'].includes(params.get('p')))player.value=params.get('p');const slider=document.getElementById('sensitivity'),sliderValue=document.getElementById('sensitivity-value');
let stored=Number(localStorage.getItem('tvpong_sensitivity'));if(Number.isFinite(stored)&&stored>=25&&stored<=250)slider.value=String(stored);
function updateSensitivity(){sliderValue.textContent=slider.value+'%';localStorage.setItem('tvpong_sensitivity',slider.value)}
slider.addEventListener('input',updateSensitivity);updateSensitivity();
let last=0,latest=.5,pending=false,lastFingerY=null,activePointer=null;let online=false;
function send(){if(pending)return;pending=true;fetch('/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:Number(player.value),y:latest}),cache:'no-store'}).then(()=>{status.textContent='Connected • '+([1,3].includes(Number(player.value))?'left':'right')+' player';dot.style.color='#8f8';online=true}).catch(()=>{status.textContent='Cannot connect to the computer';dot.style.color='#f88';online=false}).finally(()=>pending=false)}
function move(e){e.preventDefault();if(activePointer!==e.pointerId)return;if(lastFingerY===null){lastFingerY=e.clientY;return}const rect=pad.getBoundingClientRect();const delta=(e.clientY-lastFingerY)/Math.max(1,rect.height);lastFingerY=e.clientY;latest=Math.max(0,Math.min(1,latest+delta*Number(slider.value)/100));const now=performance.now();if(now-last>25){last=now;send()}}
pad.addEventListener('pointerdown',e=>{if(activePointer!==null)return;activePointer=e.pointerId;lastFingerY=e.clientY;pad.setPointerCapture(e.pointerId);e.preventDefault()});
pad.addEventListener('pointermove',e=>{if(activePointer===e.pointerId)move(e)});
function release(e){if(activePointer===e.pointerId){activePointer=null;lastFingerY=null}}
pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);pad.addEventListener('lostpointercapture',release);
async function saveName(){const name=nameInput.value.trim();if(!name){status.textContent='Enter your name!';return;}try{const r=await fetch('/name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:Number(player.value),name})});if(!r.ok)throw Error('HTTP '+r.status);status.textContent='Name saved: '+name;dot.style.color='#8f8';online=true;}catch(e){status.textContent='Could not save name';dot.style.color='#f88';online=false;}}saveBtn.addEventListener('click',saveName);nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){nameInput.blur();saveName()}});async function loadName(){try{const r=await fetch('/status',{cache:'no-store'});const data=await r.json();if(data.names&&document.activeElement!==nameInput)nameInput.value=data.names[Number(player.value)-1]||'';}catch(e){}}async function refreshStatus(){try{const response=await fetch('/status',{cache:'no-store'});if(!response.ok)throw Error('offline');const data=await response.json();online=true;dot.style.color='#8f8';const idx=Number(player.value)-1;const names=data.names||['PLAYER 1','PLAYER 2'];roster.textContent=data.mode===3?('LEFT: '+names[0]+' + '+names[2]+' | RIGHT: '+names[1]+' + '+names[3]):('LEFT: '+names[0]+' | RIGHT: '+(data.mode===1?'COMPUTER':names[1]));gameState.textContent=data.connection_paused?(data.waiting_for_connection?'GAME PAUSED – reconnecting':'Resuming in '+Math.ceil(data.resume_countdown||0)+' sec'):data.match_over?'Match finished':data.playing?'MATCH IN PROGRESS':data.mode===0?'Main menu – waiting':'Connected – waiting for match';if(document.activeElement!==nameInput&&nameInput.value==='')nameInput.value=names[idx]||'';}catch(e){online=false;dot.style.color='#f66';gameState.textContent='Connection lost – please retry';}}
async function reconnect(){try{await fetch('/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:Number(player.value)})});send();refreshStatus()}catch(e){online=false;dot.style.color='#f66'}}
document.getElementById('reconnect').addEventListener('click',reconnect);
player.addEventListener('change',()=>{latest=.5;lastFingerY=null;loadName();reconnect()});setInterval(()=>{send();refreshStatus()},2000);loadName();reconnect();</script></body></html>
